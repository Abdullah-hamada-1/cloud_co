<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>رفع ملف إلى S3</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 20px;
        }

        form {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            width: 300px;
            text-align: center;
        }

        input[type="file"] {
            background-color: #fff;
            color: #333;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            margin-bottom: 20px;
        }

        button {
            background-color: #00c9ff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            color: white;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0073e6;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            color: #ff0;
        }
    </style>
</head>
<body>

    <h1>📤 رفع ملف إلى S3</h1>

    <form method="post" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <br>
        <button type="submit">رفع</button>
    </form>

    {% if message %}
    <div class="message">{{ message }}</div>
    {% endif %}

</body>
</html>
